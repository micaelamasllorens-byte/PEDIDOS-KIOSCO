<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Kiosco</title>
<style>
  :root{
    --bg:#161211;--panel:#211a18;--panel-2:#2b211d;--line:#3a2c26;
    --ink:#f6efe6;--muted:#a89a8c;--amber:#e2c21f;--amber-ink:#2a1f00;
    --green:#3fa34d;--red:#a41f22;--gray:#4a443c;--focus:#ffd94d;
    --brand:#a41f22;--brand-2:#7c1518;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:150px;}
  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--brand),var(--brand-2));
    border-bottom:1px solid var(--brand-2);padding:14px 16px 10px;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .logo{flex:0 0 auto;height:40px;width:auto;border-radius:6px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .brand h1{font-size:20px;margin:0;letter-spacing:.5px;font-weight:800;text-transform:uppercase;color:var(--amber)}
  .brand .tag{color:#fff;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
  .sync{margin-left:auto;font-size:11px;color:#fff;opacity:.75}
  .sync.err{color:#ffd7d2;opacity:1}
  .provsel{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .provsel::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--panel-2);border:1px solid var(--line);
    color:var(--muted);padding:8px 14px;border-radius:999px;font-size:14px;
    white-space:nowrap;cursor:pointer;font-weight:600;}
  .chip.active{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
  .chip.add{color:var(--amber);border-style:dashed}
  main{padding:14px 12px 0}
  .summary{display:flex;gap:10px;margin-bottom:12px;}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:26px;line-height:1}
  .stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:6px}
  .stat.pedir b{color:var(--amber)}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:var(--bg);font-size:10px;text-transform:uppercase;
    letter-spacing:1px;color:var(--muted);text-align:center;padding:6px 4px;font-weight:700;}
  thead th.prod{text-align:left;padding-left:10px}
  tbody td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:middle}
  .prodname{font-size:14px;padding-left:10px;line-height:1.2;}
  .colnum{width:74px}.cellcenter{text-align:center}
  .ideal{color:var(--muted);font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
  input.stock{width:56px;height:40px;text-align:center;font-size:17px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-variant-numeric:tabular-nums;}
  input.stock:focus{outline:none;border-color:var(--focus);background:#2b2519}
  .pedir{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:32px;
    padding:0 8px;border-radius:8px;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
  .pedir.pos{background:var(--green);color:#062b0d}
  .pedir.zero{background:var(--gray);color:#c9c2b8}
  .pedir.neg{background:var(--red);color:#fff}
  .rowdel{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;line-height:1;}
  .rowdel:hover{color:var(--red)}.th-x{width:34px}
  .colwide{width:120px}
  input.expiry{width:118px;height:40px;text-align:center;font-size:13px;color-scheme:dark;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-variant-numeric:tabular-nums;}
  input.expiry:focus{outline:none;border-color:var(--focus);background:#2b2519}
  .checkrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:-4px 0 14px;}
  .modal input[type=checkbox]{width:auto;height:auto;margin:0}
  .addrow{display:flex;gap:8px;margin:12px 4px 20px;}
  .addrow input{flex:1;height:44px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);padding:0 12px;font-size:15px;}
  .addrow input.small{flex:0 0 74px;text-align:center}
  .addrow input:focus{outline:none;border-color:var(--focus)}
  .btn{height:44px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;padding:0 16px;}
  .btn.primary{background:var(--amber);color:var(--amber-ink)}
  .btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
  .btn.whatsapp{background:#25d366;color:#04360f}
  .bar{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:linear-gradient(0deg,#12100e,#12100ecc);border-top:1px solid var(--line);
    padding:12px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(6px);}
  .barrow{display:flex;gap:10px}
  .bar .btn{flex:1}
  .editbtn{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  .editbtn.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
  select.employee{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:13px}
  select.employee:focus{outline:none;border-color:var(--focus)}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .toolbar .hint{color:var(--muted);font-size:12px}
  .idealedit{width:56px;height:36px;text-align:center;background:#2b2519;border:1px solid var(--focus);
    border-radius:8px;color:var(--ink);font-size:15px}
  .empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:340px;}
  .modal h3{margin:0 0 14px;font-size:17px}
  .modal input{width:100%;height:44px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);padding:0 12px;font-size:15px;margin-bottom:12px}
  .modal input:focus{outline:none;border-color:var(--focus)}
  .modal .row{display:flex;gap:10px}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);
    color:#062b0d;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;
    opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1}
  .toast.bad{background:var(--red);color:#fff}
  .loading{padding:60px 20px;text-align:center;color:var(--muted)}
  .setup{max-width:520px;margin:40px auto;padding:24px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;line-height:1.6}
  .setup code{background:#000;padding:2px 6px;border-radius:5px;color:var(--amber);font-size:13px}
  /* respaldo por si Netlify inyecta su badge flotante (se apaga mejor desde Site settings) */
  a[href*="app.netlify.com"],[id*="netlify-badge" i],[class*="netlify-badge" i],a[aria-label*="netlify" i]{display:none!important}
</style>
</head>

/* ---------- Supabase (via REST) ---------- */
function sbHeaders(){
  return { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY,
           'Content-Type':'application/json', 'Prefer':'return=representation' };
}
async function load(){
  const url = `${SUPABASE_URL}/rest/v1/pedidos?id=eq.${ROW_ID}&select=data`;
  const r = await fetch(url,{headers:sbHeaders()});
  if(!r.ok) throw new Error('load '+r.status);
  const rows = await r.json();
  if(rows.length && rows[0].data){ data = rows[0].data; }
  else { data = defaultData(); await insertRow(); }
  if(!data.stock) data.stock={};
  let migrated=false;
  let jookey=data.providers.find(p=>p.id==='p_lunes');
  if(!jookey){ data.providers.push(jockeyProvider()); migrated=true; }
  else if(!jookey.variants || (jookey.rev||1)<JOCKEY_REV){ // trae la lista real (Lunes/Jueves) con los ideales correctos
    const fresh=jockeyProvider();
    jookey.name=fresh.name; jookey.variants=fresh.variants; jookey.items=fresh.items; jookey.rev=fresh.rev;
    if(!jookey.activeVariant || !fresh.variants.some(v=>v.key===jookey.activeVariant)) jookey.activeVariant=fresh.activeVariant;
    migrated=true;
  }
  let yafema=data.providers.find(p=>p.id==='p_yafema');
  if(!yafema){ data.providers.push(yafemaProvider()); migrated=true; }
  else if(!yafema.variants){ // migrar formato viejo idealW/idealS -> idealByVariant
    yafema.variants=SEASON_VARIANTS; yafema.activeVariant=data.season||'W';
    yafema.items.forEach(it=>{ if(it.idealW!==undefined){ it.idealByVariant={W:it.idealW,S:it.idealS}; delete it.idealW; delete it.idealS; } });
    migrated=true;
  }
  let casaDany=data.providers.find(p=>p.id==='p_casadany');
  if(!casaDany){ data.providers.push(casaDanyProvider()); migrated=true; }
  else if((casaDany.rev||1)<CASADANY_REV){ // trae los ideales corregidos (columna PEDIR real)
    const fresh=casaDanyProvider();
    casaDany.items=fresh.items; casaDany.rev=fresh.rev;
    migrated=true;
  }
  if(!data.providers.some(p=>p.id==='p_pepsico')){ data.providers.push(pepsicoProvider()); migrated=true; }
  const exampleIds=['p_ejemplo1','p_ejemplo2'];
  if(data.providers.some(p=>exampleIds.includes(p.id))){
    data.providers = data.providers.filter(p=>{
      if(exampleIds.includes(p.id)){ delete data.stock[p.id]; return false; }
      return true;
    });
    migrated=true;
  }
  if(migrated) save();
  if(current>=data.providers.length) current=0;
}
async function insertRow(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/pedidos`,{
    method:'POST', headers:sbHeaders(), body:JSON.stringify({id:ROW_ID, data})});
  if(!r.ok) throw new Error('insert '+r.status);
}
async function saveNow(){
  setSync('Guardando…');
  const r = await fetch(`${SUPABASE_URL}/rest/v1/pedidos?id=eq.${ROW_ID}`,{
    method:'PATCH', headers:sbHeaders(), body:JSON.stringify({data})});
  if(!r.ok){ setSync('Error al guardar', true); return; }
  setSync('Guardado ✓');
}
function save(){ // debounce para no pegarle a la base en cada tecla
  clearTimeout(saveTimer);
  setSync('Guardando…');
  saveTimer = setTimeout(saveNow, 600);
}
function setSync(txt,err){ const s=document.getElementById('sync'); s.textContent=txt; s.className='sync'+(err?' err':''); }

/* ---------- Helpers ---------- */
function prov(){ return data.providers[current]; }
function stockOf(pid){ if(!data.stock[pid]) data.stock[pid]={}; return data.stock[pid]; }
function pedirVal(ideal,have){ return (ideal||0)-(have||0); }
function isVariant(item){ return !!item.idealByVariant; }
function effIdeal(item,p){ return isVariant(item)?(item.idealByVariant[p.activeVariant]||0):(item.ideal||0); }
function setVariant(key){ prov().activeVariant=key; save(); renderAll(); }
function setEmployee(name){ prov().employee=name; save(); }

/* ---------- Render ---------- */
function renderProvs(){
  const el=document.getElementById('provsel'); el.innerHTML='';
  data.providers.forEach((p,i)=>{
    const c=document.createElement('button');
    c.className='chip'+(i===current?' active':''); c.textContent=p.name;
    c.onclick=()=>{current=i;editMode=false;renderAll();}; el.appendChild(c);
  });
  const add=document.createElement('button');
  add.className='chip add'; add.textContent='+ Proveedor'; add.onclick=openProvModal; el.appendChild(add);
}
function renderApp(){
  const p=prov(), st=stockOf(p.id);
  const hasVariants=!!(p.variants&&p.variants.length);
  let totalPedir=0, faltantes=0;
  if(p.simple){
    p.items.forEach(it=>{ const q=it.qty||0; if(q>0){totalPedir+=q;faltantes++;} });
  } else {
    p.items.forEach((it,idx)=>{ const v=pedirVal(effIdeal(it,p),st[idx]); if(v>0){totalPedir+=v;faltantes++;} });
  }
  let html=`
    <div class="toolbar"><div class="summary" style="flex:1">
      <div class="stat pedir"><b>${totalPedir}</b><span>Total a pedir</span></div>
      <div class="stat"><b>${faltantes}</b><span>Productos</span></div>
      <div class="stat"><b>${p.items.length}</b><span>En lista</span></div>
    </div></div>
    ${hasVariants?`<div class="toolbar">
      ${p.variants.map(v=>`<button class="editbtn ${p.activeVariant===v.key?'on':''}" onclick="setVariant('${v.key}')">${v.label}</button>`).join('')}
    </div>`:''}
    <div class="toolbar">
      <span class="hint">Pedido por:</span>
      <select class="employee" onchange="setEmployee(this.value)">
        <option value="">— Elegir —</option>
        ${EMPLOYEES.map(n=>`<option value="${n}" ${p.employee===n?'selected':''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="toolbar">
      <button class="editbtn ${editMode?'on':''}" onclick="toggleEdit()">${editMode?'Listo':(p.simple?'Editar lista':'Editar lista / ideales')}</button>
      ${editMode?`<span class="hint">${p.simple?'Borrá o agregá productos':'Editá ideales, borrá o agregá productos'}</span>`:''}
    </div>`;
  if(p.simple){
    html+=`<table><thead><tr>
      <th class="prod">Producto</th><th class="colnum">Cantidad</th>
      <th class="colwide">Vencimiento</th>
      ${editMode?'<th class="th-x"></th>':''}
    </tr></thead><tbody>`;
    if(!p.items.length) html+=`<tr><td colspan="4"><div class="empty">Sin productos. Activá “Editar” y agregá.</div></td></tr>`;
    p.items.forEach((it,idx)=>{
      const qty=it.qty||''; const exp=it.expiry||'';
      html+=`<tr>
        <td class="prodname">${escapeHtml(it.name)}</td>
        <td class="cellcenter"><input class="stock" type="number" inputmode="numeric" value="${qty}" placeholder="0" onchange="setQty(${idx},this.value)"></td>
        <td class="cellcenter"><input class="expiry" type="date" value="${exp}" onchange="setExpiry(${idx},this.value)"></td>
        ${editMode?`<td class="cellcenter"><button class="rowdel" onclick="delItem(${idx})">✕</button></td>`:''}
      </tr>`;
    });
    html+=`</tbody></table>`;
    if(editMode){
      html+=`<div class="addrow">
          <input id="newItemName" placeholder="Nuevo producto">
          <button class="btn primary" onclick="addItem()">Agregar</button>
        </div>
        <div class="addrow" style="margin-top:-8px">
          <button class="btn ghost" style="flex:1" onclick="delProvider()">Eliminar este proveedor</button>
        </div>`;
    }
  } else {
    html+=`<table><thead><tr>
      <th class="prod">Producto</th><th class="colnum">Ideal</th>
      <th class="colnum">Hay</th><th class="colnum">Pedir</th>
      ${editMode?'<th class="th-x"></th>':''}
    </tr></thead><tbody>`;
    if(!p.items.length) html+=`<tr><td colspan="5"><div class="empty">Sin productos. Activá “Editar” y agregá.</div></td></tr>`;
    p.items.forEach((it,idx)=>{
      const have=st[idx]??''; const ideal=effIdeal(it,p); const v=pedirVal(ideal,st[idx]);
      const cls=v>0?'pos':(v===0?'zero':'neg');
      html+=`<tr>
        <td class="prodname">${escapeHtml(it.name)}</td>
        <td class="cellcenter">${editMode
          ?`<input class="idealedit" type="number" inputmode="numeric" value="${ideal}" onchange="setIdeal(${idx},this.value)">`
          :`<span class="ideal">${ideal}</span>`}</td>
        <td class="cellcenter"><input class="stock" type="number" inputmode="numeric" value="${have}" placeholder="0" onchange="setStock(${idx},this.value)"></td>
        <td class="cellcenter"><span class="pedir ${cls}">${v}</span></td>
        ${editMode?`<td class="cellcenter"><button class="rowdel" onclick="delItem(${idx})">✕</button></td>`:''}
      </tr>`;
    });
    html+=`</tbody></table>`;
    if(editMode){
      html+=`<div class="addrow">
          <input id="newItemName" placeholder="Nuevo producto">
          <input id="newItemIdeal" class="small" type="number" inputmode="numeric" placeholder="Ideal">
          <button class="btn primary" onclick="addItem()">Agregar</button>
        </div>
        <div class="addrow" style="margin-top:-8px">
          <button class="btn ghost" style="flex:1" onclick="delProvider()">Eliminar este proveedor</button>
        </div>`;
    }
  }
  document.getElementById('app').innerHTML=html;
}
function renderAll(){ renderProvs(); renderApp(); }

/* ---------- Acciones ---------- */
function toggleEdit(){
  if(editMode){ editMode=false; renderApp(); return; }
  requireUnlock(()=>{ editMode=true; renderApp(); });
}
function setStock(idx,val){ const st=stockOf(prov().id);
  if(val===''||val===null) delete st[idx]; else st[idx]=Math.max(0,parseInt(val,10)||0);
  save(); renderApp(); }
function setIdeal(idx,val){ const p=prov(), it=p.items[idx]; const v=Math.max(0,parseInt(val,10)||0);
  if(isVariant(it)) it.idealByVariant[p.activeVariant]=v; else it.ideal=v; save(); renderApp(); }
function setQty(idx,val){ const it=prov().items[idx]; it.qty=Math.max(0,parseInt(val,10)||0); save(); renderApp(); }
function setExpiry(idx,val){ const it=prov().items[idx]; it.expiry=val||''; save(); renderApp(); }
function addItem(){ const n=document.getElementById('newItemName').value.trim();
  if(!n) return;
  if(prov().simple){ prov().items.push({name:n,qty:0,expiry:''}); }
  else { const id=parseInt(document.getElementById('newItemIdeal').value,10);
    prov().items.push({name:n,ideal:isNaN(id)?0:Math.max(0,id)}); }
  save(); renderApp(); }
function delItem(idx){ prov().items.splice(idx,1);
  const st=stockOf(prov().id); const ns={};
  Object.keys(st).forEach(k=>{const ki=+k; if(ki<idx)ns[ki]=st[k]; else if(ki>idx)ns[ki-1]=st[k];});
  data.stock[prov().id]=ns; save(); renderApp(); }
function resetStock(){
  if(prov().simple){
    if(!confirm('¿Vaciar las cantidades cargadas de '+prov().name+'?'))return;
    prov().items.forEach(it=>{ it.qty=0; }); save(); renderApp(); toast('Cantidades vaciadas'); return;
  }
  if(!confirm('¿Vaciar el stock cargado de '+prov().name+'?'))return;
  data.stock[prov().id]={}; save(); renderApp(); toast('Stock vaciado'); }
function openProvModal(){ requireUnlock(()=>{
  document.getElementById('provName').value='';
  document.getElementById('provSimple').checked=false;
  document.getElementById('provModal').classList.add('show'); document.getElementById('provName').focus(); }); }
function closeProvModal(){ document.getElementById('provModal').classList.remove('show'); }
function saveProv(){ const n=document.getElementById('provName').value.trim(); if(!n)return;
  const simple=document.getElementById('provSimple').checked;
  data.providers.push({id:'p_'+Date.now(),name:n,items:[],simple}); current=data.providers.length-1;
  closeProvModal(); editMode=true; save(); renderAll(); }
function delProvider(){ if(data.providers.length<=1){alert('Tiene que quedar al menos un proveedor.');return;}
  if(!confirm('¿Eliminar el proveedor '+prov().name+' y su lista?'))return;
  delete data.stock[prov().id]; data.providers.splice(current,1); current=0; editMode=false; save(); renderAll(); }
function formatDateAR(iso){ const [y,m,d]=(iso||'').split('-'); return (d&&m&&y)?`${d}/${m}/${y}`:iso; }
function buildOrderText(){ const p=prov(), st=stockOf(p.id); const lines=[];
  if(p.simple){
    p.items.forEach(it=>{ const q=it.qty||0; if(q>0) lines.push(`${q}  ${it.name}${it.expiry?` — Vto: ${formatDateAR(it.expiry)}`:''}`); });
  } else {
    p.items.forEach((it,idx)=>{ const v=pedirVal(effIdeal(it,p),st[idx]); if(v>0) lines.push(`${v}  ${it.name}`); });
  }
  const quien=p.employee?`\nPedido por: ${p.employee}`:'';
  return `PEDIDO — ${p.name}${quien}\n`+(lines.length?lines.join('\n'):'(nada para pedir)'); }
function copyOrder(){ const text=buildOrderText();
  navigator.clipboard.writeText(text).then(()=>toast('Pedido copiado'),()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Pedido copiado');}catch(e){alert(text);}ta.remove(); }); }
const ARI_PHONE='5491167958267', MICA_PHONE='5492241491822';
function sendWhatsApp(phone){ const text=buildOrderText();
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text), '_blank'); }
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT; function toast(msg,bad){ const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),1600); }

/* ---------- Pantalla de configuración si falta Supabase ---------- */
function showSetup(){
  document.getElementById('app').innerHTML=`
  <div class="setup">
    <h3 style="margin-top:0">Falta configurar la base de datos</h3>
    <p>Abrí este archivo <code>index.html</code> con el Bloc de notas y, arriba de todo en la parte de CONFIGURACIÓN, pegá tu <code>SUPABASE_URL</code> y tu <code>SUPABASE_KEY</code>. Después volvé a subirlo.</p>
    <p style="color:var(--muted)">Seguí los pasos que te pasaron por chat. Una vez cargados los datos, esta pantalla desaparece sola.</p>
  </div>`;
}

/* ---------- Init ---------- */
(async function(){
  if(!configOK()){ showSetup(); return; }
  try{ await load(); renderAll(); setSync('Guardado ✓'); }
  catch(e){ console.error(e); setSync('Error de conexión', true);
    document.getElementById('app').innerHTML=`<div class="setup">
      <h3 style="margin-top:0">No se pudo conectar a la base de datos</h3>
      <p>Revisá que la URL y la clave de Supabase estén bien pegadas, y que hayas creado la tabla <code>pedidos</code>.</p></div>`; }
})();
</script>
